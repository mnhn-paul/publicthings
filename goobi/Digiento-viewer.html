<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MNHNL Specimen Browser</title>
<style>
  :root { --bg:#f4f2ec; --panel:#fff; --ink:#24312b; --muted:#6b7a72;
          --accent:#2e6e4e; --accent2:#8fbc9f; --line:#e0ddd2; --mark:#b4770f; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--ink); }
  header { background:var(--panel); border-bottom:2px solid var(--accent);
           padding:14px 22px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:19px; margin:0; }
  header .crumb { color:var(--muted); font-size:14px; }
  main { padding:22px; max-width:1200px; margin:0 auto; }

  textarea { width:100%; height:180px; font-family:ui-monospace,Consolas,monospace;
             font-size:13px; padding:10px; border:1px solid var(--line); border-radius:8px; }
  .pastebar { display:flex; gap:10px; align-items:center; margin:10px 0 4px; flex-wrap:wrap; }
  .pastebar .note { color:var(--muted); font-size:12.5px; }

  .boxes { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; }
  .boxcard { background:var(--panel); border:1px solid var(--line); border-radius:10px;
             padding:18px; cursor:pointer; transition:box-shadow .15s, transform .15s; }
  .boxcard:hover { box-shadow:0 4px 14px rgba(0,0,0,.10); transform:translateY(-2px); }
  .boxcard .name { font-size:21px; font-weight:700; color:var(--accent); }
  .boxcard .count { color:var(--muted); font-size:13px; margin-top:4px; }
  .boxcard .mosaic { display:flex; gap:4px; margin-top:10px; }
  .boxcard .mosaic img { width:44px; height:44px; object-fit:cover; border-radius:6px;
                         background:#e8e5da; display:block; }

  .unitgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
  .bkpanel { background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--mark);
             border-radius:10px; padding:14px 16px; margin-bottom:18px; }
  .bkpanel h2 { font-size:15px; margin:0 0 10px; color:var(--mark); }
  .bkpanel .unitgrid { grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); }
  .bkpanel .ucard-thumb { height:90px; }
  .unitcard { background:var(--panel); border:1px solid var(--line); border-radius:10px;
              overflow:hidden; cursor:pointer; transition:box-shadow .15s, transform .15s;
              position:relative; }
  .unitcard:hover { box-shadow:0 4px 14px rgba(0,0,0,.10); transform:translateY(-2px); }
  .markbadge { position:absolute; top:8px; right:8px; width:22px; height:22px; border-radius:50%;
               background:var(--mark); color:#fff; font-size:12px; line-height:1;
               display:flex; align-items:center; justify-content:center;
               box-shadow:0 1px 4px rgba(0,0,0,.3); }
  .unitcard.marked .ucard-label { color:var(--mark); }
  .bkbadge { background:var(--mark); color:#fff; font-size:12px; padding:2px 10px;
             border-radius:12px; align-self:center; }
  .ucard-thumb { height:120px; background:#e8e5da; display:flex; align-items:center;
                 justify-content:center; color:var(--muted); font-size:11.5px; }
  .ucard-thumb img { width:100%; height:100%; object-fit:contain; display:block; }
  .ucard-label { padding:8px 10px; font-size:14px; font-weight:600; border-top:1px solid var(--line); }

  .viewer-top { display:flex; align-items:center; justify-content:space-between;
                flex-wrap:wrap; gap:10px; margin-bottom:12px; }
  .pos { color:var(--muted); font-size:14px; }
  .unitlabel { font-size:20px; font-weight:700; }
  .progress { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-bottom:14px; }
  .progress > div { height:100%; background:var(--accent); width:0; transition:width .2s; }
  .stage { background:#23282a; border-radius:10px; min-height:60vh; display:flex;
           align-items:center; justify-content:center; position:relative; overflow:hidden;
           touch-action:none; }
  .pageimg { max-width:100%; max-height:78vh; display:block; cursor:zoom-in;
             transform-origin:center center; user-select:none; -webkit-user-drag:none; }
  .stage.zoomed .pageimg { cursor:grab; }
  .stage.zoomed .pageimg:active { cursor:grabbing; }
  .loading,.error { color:#fff; padding:30px; text-align:center; }
  .error a { color:var(--accent2); }
  .strip { position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
           background:rgba(0,0,0,.55); border-radius:20px; padding:6px 10px;
           display:flex; gap:8px; }
  .strip .dot { width:40px; height:40px; border-radius:8px; object-fit:cover; cursor:pointer;
                border:2px solid transparent; background:#444; }
  .strip .dot.active { border-color:var(--accent2); }

  /* side arrows: previous / next specimen (wide screens) */
  .sidearrow { position:absolute; top:50%; transform:translateY(-50%); width:46px; height:46px;
               padding:0; border-radius:50%; background:rgba(0,0,0,.55); color:#fff;
               font-size:18px; line-height:1; display:flex; align-items:center;
               justify-content:center; }
  .sidearrow:hover { background:var(--accent); }
  .sidearrow.left { left:14px; }
  .sidearrow.right { right:14px; }
  .sidearrow:disabled { background:rgba(0,0,0,.30); color:#9aa39d; cursor:not-allowed; }
  @media (max-width:700px) { .sidearrow { display:none; } }

  /* zoom toolbar (top-right of the image) */
  .zoombar { position:absolute; top:10px; right:10px; display:flex; gap:6px; }
  .zoombar button { width:36px; height:36px; padding:0; border-radius:50%;
                    background:rgba(0,0,0,.55); color:#fff; font-size:16px; line-height:1; }
  .zoombar button:hover { background:var(--accent); }

  /* image-cycle chevrons flanking the thumbnail strip */
  .strip .chev { width:30px; height:30px; padding:0; border:0; border-radius:50%;
                 background:transparent; color:#fff; font-size:13px; cursor:pointer;
                 align-self:center; }
  .strip .chev:hover { background:rgba(255,255,255,.25); }

  .controls { display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px;
           padding:10px 22px; font-size:15px; cursor:pointer; }
  button:disabled { background:var(--line); color:var(--muted); cursor:not-allowed; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .hint { text-align:center; color:var(--muted); font-size:12.5px; margin-top:10px; }
  .backlink { background:none; color:var(--accent); border:0; font-size:14px;
              padding:6px 0; cursor:pointer; text-decoration:underline; }
  #pasteWrap { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; }

  /* metadata panel under the image */
  .meta { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          padding:12px 16px; margin-top:14px; display:grid;
          grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:4px 22px; font-size:13.5px; }
  .meta:empty { display:none; }
  .meta .k { color:var(--muted); margin-right:6px; }

  /* keyboard help overlay */
  .headbtns { margin-left:auto; display:flex; gap:8px; }
  .helpbtn { padding:4px 12px; font-size:12.5px; }
  .helpoverlay { position:fixed; inset:0; background:rgba(20,25,23,.55); display:flex;
                 align-items:center; justify-content:center; z-index:50; }
  .helpoverlay .panel { background:var(--panel); border-radius:10px; padding:20px 26px;
                        width:min(440px,90vw); box-shadow:0 10px 40px rgba(0,0,0,.35); }
  .helpoverlay h2 { margin:0 0 12px; font-size:17px; color:var(--accent); }
  .helpoverlay table { border-collapse:collapse; font-size:14px; }
  .helpoverlay td { padding:4px 10px 4px 0; }
  .helpoverlay td.k { font-family:ui-monospace,Consolas,monospace; background:var(--bg);
                      border:1px solid var(--line); border-radius:4px; padding:1px 7px; white-space:nowrap; }
  .helpoverlay td.v { color:var(--muted); }
  .helpoverlay .close { margin-top:14px; width:100%; }
</style>
</head>
<body>
<header>
  <h1>MNHNL Specimen Browser</h1>
  <span class="crumb" id="crumb"></span>
  <span class="headbtns">
    <button class="ghost helpbtn" onclick="clearSavedData()" title="Clear loaded records and bookmarks saved in this browser">Clear saved data</button>
    <button class="ghost helpbtn" onclick="toggleHelp()">? shortcuts</button>
  </span>
</header>
<main id="app"></main>

<script>
const API = "https://face.mnhn.gov.lu/viewer/api/v1/records/";
const MIRADOR = "https://face.mnhn.gov.lu/viewer/mirador/?manifest=";
const cache = new Map();

/* ---------- session persistence (localStorage) ---------- */
const LS_UNITS = "mnhnl.units", LS_BOOKMARKS = "mnhnl.bookmarked";
localStorage.removeItem("mnhnl.reviewed");            // removed "reviewed" feature
let bookmarks = new Set();
try { bookmarks = new Set(JSON.parse(localStorage.getItem(LS_BOOKMARKS) || "[]")); } catch {}
const saveBookmarks = () => localStorage.setItem(LS_BOOKMARKS, JSON.stringify([...bookmarks]));

// wipe all saved records + bookmarks from this browser (with confirmation)
window.clearSavedData = () => {
  if (!UNITS.length && !bookmarks.size) { alert("Nothing is saved yet."); return; }
  if (!confirm(`Clear all saved data?\n\nThis removes ${UNITS.length} loaded record(s) and `
      + `${bookmarks.size} bookmark(s) saved in this browser.`)) return;
  localStorage.removeItem(LS_UNITS);
  localStorage.removeItem(LS_BOOKMARKS);
  UNITS = [];
  bookmarks = new Set();
  cache.clear();
  setRoute({ view: "paste" });
};
function restoreUnits() {
  try {
    const arr = JSON.parse(localStorage.getItem(LS_UNITS) || "null");
    if (Array.isArray(arr) && arr.length &&
        arr.every(u => u && typeof u.id === "string" &&
                       (u.box == null || typeof u.box === "string"))) {
      UNITS = arr;
      return true;
    }
  } catch {}
  return false;
}

const app = document.getElementById("app");
const crumb = document.getElementById("crumb");

let UNITS = [];                       // [{id, box}]
let route = { view: "paste" };        // paste | boxes | list | viewer
let curPages = [], curPage = 0;

const manifestUrl = id => API + id + "/manifest/";

async function getManifest(id) {
  if (cache.has(id)) return cache.get(id);
  const p = fetch(manifestUrl(id)).then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  });
  cache.set(id, p);
  p.catch(() => cache.delete(id));
  return p;
}

function pagesOf(m) {
  let canvases = [];
  (m.sequences || []).forEach(s => { if (s.canvases) canvases = canvases.concat(s.canvases); });
  return canvases.map(c => {
    const img = (c.images && c.images[0] && c.images[0].resource) || {};
    return { serviceId: img.service && (img.service["@id"] || img.service.id),
             fallback: img["@id"] };
  });
}

const imgUrl = (p, w) =>
  p.serviceId ? p.serviceId.replace(/\/$/, "") + "/full/" + w + ",/0/default.jpg" : p.fallback;

/* small preview: canvas/manifest "thumbnail" entry, else a tiny IIIF region */
function thumbOf(m) {
  const first = (m.sequences || []).flatMap(s => s.canvases || [])[0] || {};
  const pick = t => Array.isArray(t) ? t[0] : t;
  const entry = pick(first.thumbnail) || pick(m.thumbnail);
  const url = entry && (entry["@id"] || entry.id);
  if (url) return url;
  const pages = pagesOf(m);
  return pages.length ? imgUrl(pages[0], 160) : null;
}

/* ---------- manifest metadata ---------- */

// IIIF language values come as strings, {@value:…} maps, {lang:[…]} maps, or
// arrays of {language, value} pairs — prefer English, then German, then any
const LANGS = ["en", "de", "none"];
const langText = v => {
  if (v == null) return "";
  if (typeof v === "string") return v.trim();
  if (Array.isArray(v)) {
    if (v.length && v.every(e => e && typeof e === "object" && "@value" in e)) {
      for (const l of LANGS) {                        // pick the preferred language
        const hit = v.find(e => e["@language"] === l && langText(e["@value"]));
        if (hit) return langText(hit["@value"]);
      }
      return (v.map(e => langText(e["@value"])).filter(Boolean))[0] || "";
    }
    return v.map(e => langText(e)).filter(Boolean).join("; ");
  }
  if (typeof v === "object") {
    if ("@value" in v) return langText(v["@value"]);
    for (const key of [...LANGS, ...Object.keys(v)]) {
      const t = langText(v[key]);
      if (t) return t;
    }
  }
  return String(v);
};

// all metadata as readable label/value pairs
function metaOf(m) {
  const md = Array.isArray(m.metadata) ? m.metadata : [];
  return md.map(e => ({ label: langText(e && e.label), value: langText(e && e.value) }))
           .filter(e => e.label);
}

// only these fields are shown under the image, in this order
const KEEP_META = ["storage location", "md_recordid", "md_processid"];
const shownMetaOf = m => KEEP_META
  .map(k => metaOf(m).find(e => e.label.toLowerCase() === k))
  .filter(Boolean);

// the box comes from the "Storage location" metadata field
const OTHER_BOX = "other";
const boxOf = m => {
  const e = metaOf(m).find(e => /^(storage\s*location|lagerort)$/i.test(e.label));
  return e && e.value.trim() ? e.value.trim() : null;
};

const nameOf = m => langText(m.label) ||
  ((metaOf(m).find(e => /^md_recordid$/i.test(e.label)) || {}).value) || null;

// fill in each unit's box from its manifest (missing → "other"), then persist
async function resolveBoxes(units, onProgress) {
  let done = 0;
  await Promise.all(units.map(async u => {
    if (!u.box) {
      try { u.box = boxOf(await getManifest(u.id)) || OTHER_BOX; }
      catch { u.box = OTHER_BOX; }
    }
    done++;
    if (onProgress) onProgress(done, units.length);
  }));
  localStorage.setItem(LS_UNITS, JSON.stringify(UNITS));
}

const boxNames = () => [...new Set(UNITS.map(u => u.box))]
  .sort((a, b) => parseInt(a.replace(/\D/g, "")) - parseInt(b.replace(/\D/g, "")) || a.localeCompare(b));
const unitsIn = box => UNITS.filter(u => u.box === box);

/* ---------- paste view ---------- */

function renderPaste() {
  const hasData = UNITS.length > 0;
  crumb.innerHTML = hasData
    ? `<button class="backlink" onclick="go('boxes')">← Back to the ${UNITS.length} loaded record(s)</button> &nbsp;Add records`
    : "Paste data";
  app.innerHTML = `
    <div id="pasteWrap">
      <label for="paste"><b>Paste your specimen IDs</b> — one ID per line
        (other columns are ignored).${hasData ? " New IDs are <b>added</b> to the records already loaded; duplicates are skipped." : ""}
        The box of each specimen is read from the
        <code>Storage location</code> metadata of its IIIF manifest;
        records without that field are placed in the “other” box.
        Loaded records stay available until you press “Clear saved data”.<br>
        Tip: a direct link like <code>…Digiento-viewer.html#id/MNHNL196155</code>
        opens any record on the fly — no paste needed.</label>
      <textarea id="paste" placeholder="MNHNL190875&#10;MNHNL190876&#10;MNHNL122001 ..."></textarea>
      <div class="pastebar">
        <button onclick="loadPaste()">${hasData ? "Add units" : "Load units"}</button>
        <button class="ghost" onclick="loadDemo()">Load examples</button>
        <span class="note" id="pasteMsg"></span>
      </div>
    </div>`;
}

window.loadPaste = async () => {
  const text = document.getElementById("paste").value;
  const ids = [];
  const bad = [];
  text.split(/\r?\n/).forEach((line, i) => {
    const t = line.trim();
    if (!t) return;
    const id = t.split(/\t+|\s+/).map(c => c.trim()).find(c => /^MNHNL/i.test(c));
    if (id) ids.push(id.toUpperCase());
    else bad.push(i + 1);
  });
  const msg = document.getElementById("pasteMsg");
  if (!ids.length) {
    msg.textContent = "No valid IDs found. Expected e.g. MNHNL190875";
    return;
  }
  const existing = new Set(UNITS.map(u => u.id));     // merge, skip duplicates
  const seen = new Set();
  const fresh = [];
  let dups = 0;
  ids.forEach(id => {
    if (existing.has(id) || seen.has(id)) { dups++; return; }
    seen.add(id);
    fresh.push({ id });                              // box comes from the manifest
  });
  if (!fresh.length) {
    msg.textContent = `All ${ids.length} ID(s) are already loaded — nothing new to add.`;
    return;
  }
  UNITS.push(...fresh);
  await resolveBoxes(fresh, (d, n) => {              // read boxes of the new records
    msg.textContent = `Reading boxes from manifests (${d}/${n})…`;
  });
  msg.textContent = `${fresh.length} new record(s) added — ${UNITS.length} loaded in total`
    + (dups ? ` · ${dups} duplicate(s) skipped` : "")
    + (fresh.some(u => u.box === OTHER_BOX) ? " — some without storage location → “other”" : "")
    + (bad.length ? " — skipped lines: " + bad.join(", ") : "");
  setRoute({ view: "boxes" });
};

window.loadDemo = () => {
  document.getElementById("paste").value =
    "MNHNL190875\nMNHNL190876\nMNHNL190877\nMNHNL190878\nMNHNL190879\nMNHNL196540\n" +
    "MNHNL122001\nMNHNL122014\nMNHNL133403\nMNHNL133409\nMNHNL133410\nMNHNL133411";
};

/* ---------- boxes view ---------- */

function renderBoxes() {
  crumb.innerHTML = `<button class="backlink" onclick="go('paste')">＋ Add records</button> &nbsp;All boxes`;
  const names = boxNames();
  const bkUnits = UNITS.filter(u => bookmarks.has(u.id) && u.box);
  const bkHTML = bkUnits.length ? `
    <div class="bkpanel">
      <h2>★ Bookmarked — quick access (${bkUnits.length})</h2>
      <div class="unitgrid">` + bkUnits.map((u, i) =>
        `<div class="unitcard marked" onclick="openBookmark('${u.id}')">
           <div class="ucard-thumb" id="bkthumb-${i}">loading…</div>
           <div class="markbadge">★</div>
           <div class="ucard-label">${u.id}
             <br><small style="color:var(--muted);font-weight:400;font-size:11.5px">${u.box}</small></div></div>`
      ).join("") + `</div></div>` : "";
  app.innerHTML = bkHTML + `<div class="boxes">` + names.map((b, i) => {
    const units = unitsIn(b);
    const n = units.length;
    const r = units.filter(u => bookmarks.has(u.id)).length;
    return `<div class="boxcard" onclick="openBoxIdx(${i})">
      <div class="name">${b}</div>
      <div class="count">${n} unit${n > 1 ? "s" : ""}${r ? ` · ${r} bookmarked` : ""}</div>
      <div class="mosaic" id="mosaic-${i}"></div></div>`;
  }).join("") + `</div>`;
  if (bkUnits.length) loadThumbs(bkUnits, "bkthumb");
  names.forEach((b, i) => fillMosaic(i, unitsIn(b).slice(0, 4)));
}

window.openBookmark = id => setRoute({ view: "byid", id });

async function fillMosaic(i, units) {
  const el = document.getElementById("mosaic-" + i);
  if (!el) return;
  const thumbs = await Promise.all(units.map(async u => {
    try { return thumbOf(await getManifest(u.id)); } catch { return null; }
  }));
  if (!el.isConnected) return;
  thumbs.filter(Boolean).forEach(src => {
    const im = document.createElement("img");
    im.src = src; im.alt = ""; im.loading = "lazy";
    el.appendChild(im);
  });
}

/* ---------- unit list of a box ---------- */

function renderList() {
  const b = route.box;
  const list = unitsIn(b);
  const nMarked = list.filter(u => bookmarks.has(u.id)).length;
  crumb.innerHTML = `<button class="backlink" onclick="go('boxes')">← All boxes</button> &nbsp;${b}`;
  app.innerHTML = `<p style="margin:4px 0 10px">Select a specimen in ${b}${nMarked ? ` — ${nMarked} bookmarked` : ""}
      (<button class="backlink" onclick="openBoxIndex(0)">start at the first one →</button>)</p>
    <div class="unitgrid">` + list.map((u, i) => {
      const marked = bookmarks.has(u.id);
      return `<div class="unitcard${marked ? " marked" : ""}" onclick="openBoxIndex(${i})">
         <div class="ucard-thumb" id="thumb-${i}">loading…</div>
         ${marked ? `<div class="markbadge">★</div>` : ""}
         <div class="ucard-label">${i + 1}. &nbsp;${u.id}</div></div>`;
    }).join("") + `</div>`;
  loadThumbs(list);
}

async function loadThumbs(list, prefix = "thumb") {
  await Promise.all(list.map(async (u, i) => {
    const el = document.getElementById(prefix + "-" + i);
    try {
      const m = await getManifest(u.id);
      if (!el || !el.isConnected) return;
      const t = thumbOf(m);
      if (t) el.innerHTML = `<img src="${t}" alt="preview of ${u.id}" loading="lazy">`;
      else el.textContent = "no image";
      const name = nameOf(m);
      const card = el.closest(".unitcard");
      if (card && name) card.title = `${u.id} — ${name}`;   // metadata on hover
    } catch {
      if (el && el.isConnected) el.textContent = "unavailable";
    }
  }));
}

/* ---------- viewer ---------- */

function renderViewer() {
  const { box, idx } = route;
  const list = unitsIn(box);
  const unit = list[idx];
  crumb.innerHTML =
    `<button class="backlink" onclick="go('boxes')">← All boxes</button>` +
    `<button class="backlink" onclick="go('list')"> &nbsp;${box} list</button>` +
    ` &nbsp;Unit ${idx + 1} / ${list.length}`;
  app.innerHTML = `
    <div class="viewer-top">
      <div class="pos">${box} — specimen ${idx + 1} of ${list.length}</div>
      <div class="unitlabel">${unit.id}</div>
      <span class="bkbadge" id="bkBadge" style="display:${bookmarks.has(unit.id) ? "inline-block" : "none"}">★ bookmarked</span>
      <a href="${MIRADOR + manifestUrl(unit.id)}" target="_blank" rel="noopener">Mirador ↗</a>
    </div>
    <div class="progress"><div style="width:${100 * (idx + 1) / list.length}%"></div></div>
    <div class="stage" id="stage"><div class="loading" id="msg">Loading…</div></div>
    <div class="meta" id="metaBox"></div>
    <div class="controls">
      <button id="prev" ${idx === 0 ? "disabled" : ""} onclick="nav(-1)">◀ Prev</button>
      <button class="ghost" id="markBtn" onclick="toggleBookmark()">${bookmarks.has(unit.id) ? "★ Bookmarked — undo (B)" : "Bookmark (B)"}</button>
      <button id="next" ${idx === list.length - 1 ? "disabled" : ""} onclick="nav(1)">Next ▶</button>
    </div>
    <div class="hint">Keyboard: → / Space next specimen · ← previous · ↑/↓ additional images · B bookmark · Esc reset zoom · ? all shortcuts · click image to zoom · drag or scroll to pan &amp; zoom</div>`;
  loadUnit(unit);
  const nx = list[idx + 1];
  if (nx) getManifest(nx.id).catch(() => {});   // prefetch next specimen
}

async function loadUnit(unit) {
  const stage = document.getElementById("stage");
  curPage = 0;
  applyZoom = null; stageZoomAt = null;
  stage.innerHTML = `<div class="loading">Loading ${unit.id}…</div>`;
  try {
    const m = await getManifest(unit.id);
    curPages = pagesOf(m);
    const metaBox = document.getElementById("metaBox");   // storage location / record id / process id
    if (metaBox) {
      metaBox.innerHTML = "";
      shownMetaOf(m).forEach(({ label, value }) => {
        const row = document.createElement("div");
        const k = document.createElement("span"); k.className = "k"; k.textContent = label + ":";
        const v = document.createElement("span"); v.textContent = value;
        row.append(k, v);
        metaBox.appendChild(row);
      });
    }
    if (!curPages.length) throw new Error("no images in manifest");
    showPage();
  } catch (e) {
    curPages = [];
    const metaBox = document.getElementById("metaBox");
    if (metaBox) metaBox.innerHTML = "";
    stage.innerHTML = `<div class="error">Could not load images for ${unit.id} (${e.message}).<br>
      Try the <a href="${MIRADOR + manifestUrl(unit.id)}" target="_blank" rel="noopener">Mirador viewer</a> directly.</div>`;
  }
}

/* ---------- pan & zoom ---------- */

let zoom = { scale: 1, tx: 0, ty: 0 };   // zoom state of the current page
let applyZoom = null, stageZoomAt = null;

function showPage() {
  const stage = document.getElementById("stage");
  const p = curPages[curPage];
  stage.innerHTML = "";
  zoom = { scale: 1, tx: 0, ty: 0 };
  let hiRes = false;

  const img = document.createElement("img");
  img.className = "pageimg";
  img.src = imgUrl(p, 1600);
  img.alt = "specimen image";
  img.draggable = false;
  stage.appendChild(img);

  applyZoom = () => {
    // clamp panning so the image cannot leave the stage
    const maxX = Math.max(0, (img.offsetWidth * zoom.scale - stage.clientWidth) / 2);
    const maxY = Math.max(0, (img.offsetHeight * zoom.scale - stage.clientHeight) / 2);
    zoom.tx = Math.min(maxX, Math.max(-maxX, zoom.tx));
    zoom.ty = Math.min(maxY, Math.max(-maxY, zoom.ty));
    img.style.transform = `translate(${zoom.tx}px, ${zoom.ty}px) scale(${zoom.scale})`;
    stage.classList.toggle("zoomed", zoom.scale > 1.001);
    if (zoom.scale > 1.4 && !hiRes) { hiRes = true; img.src = imgUrl(p, 3000); } // sharper tiles
  };

  // zoom to an absolute scale, keeping the point (cx,cy) fixed on screen
  stageZoomAt = (ns, cx, cy) => {
    const sr = stage.getBoundingClientRect();
    const px = cx - sr.left - sr.width / 2, py = cy - sr.top - sr.height / 2;
    ns = Math.min(6, Math.max(1, ns));
    zoom.tx = px - (px - zoom.tx) * ns / zoom.scale;
    zoom.ty = py - (py - zoom.ty) * ns / zoom.scale;
    zoom.scale = ns;
    applyZoom();
  };
  const zoomBy = (factor, cx, cy) => stageZoomAt(zoom.scale * factor, cx, cy);

  // scroll wheel zooms toward the cursor
  stage.addEventListener("wheel", e => {
    e.preventDefault();
    zoomBy(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY);
  }, { passive: false });

  // drag to pan, pinch to zoom, click to zoom in / reset
  const pts = new Map();
  let drag = null, pinch = null;
  img.addEventListener("pointerdown", e => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) drag = { x: e.clientX, y: e.clientY, tx: zoom.tx, ty: zoom.ty, moved: false };
    else {
      drag = null;
      const [a, b] = [...pts.values()];
      pinch = { dist: Math.hypot(a.x - b.x, a.y - b.y), scale: zoom.scale };
    }
    img.setPointerCapture(e.pointerId);
  });
  img.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pts.size === 2) {
      const [a, b] = [...pts.values()];
      stageZoomAt(pinch.scale * Math.hypot(a.x - b.x, a.y - b.y) / pinch.dist,
                  (a.x + b.x) / 2, (a.y + b.y) / 2);
    } else if (drag && zoom.scale > 1) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
      zoom.tx = drag.tx + dx; zoom.ty = drag.ty + dy;
      applyZoom();
    }
  });
  const pointerEnd = e => {
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (pts.size > 0) return;
    const d = drag; drag = null;
    if (!d || d.moved) return;
    if (zoom.scale > 1) { zoom = { scale: 1, tx: 0, ty: 0 }; applyZoom(); }
    else stageZoomAt(2.5, e.clientX, e.clientY);
  };
  img.addEventListener("pointerup", pointerEnd);
  img.addEventListener("pointercancel", pointerEnd);

  // zoom toolbar
  const bar = document.createElement("div");
  bar.className = "zoombar";
  const center = () => { const r = stage.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  [["+", "Zoom in (+)", () => zoomBy(1.35, ...center())],
   ["−", "Zoom out (−)", () => zoomBy(1 / 1.35, ...center())],
   ["1:1", "Reset zoom (Esc)", () => { zoom = { scale: 1, tx: 0, ty: 0 }; applyZoom(); }]]
   .forEach(([g, t, fn]) => {
     const b = document.createElement("button");
     b.textContent = g; b.title = t; b.onclick = fn;
     bar.appendChild(b);
   });
  stage.appendChild(bar);

  // side arrows: previous / next specimen
  const list = unitsIn(route.box);
  [["left", -1, "◀"], ["right", 1, "▶"]].forEach(([side, dir, glyph]) => {
    const b = document.createElement("button");
    b.className = "sidearrow " + side;
    b.textContent = glyph;
    b.title = (dir < 0 ? "Previous" : "Next") + " specimen (" + (dir < 0 ? "←" : "→") + ")";
    b.disabled = (dir < 0 && route.idx === 0) || (dir > 0 && route.idx === list.length - 1);
    b.onclick = e => { e.stopPropagation(); nav(dir); };
    stage.appendChild(b);
  });

  // thumbnail strip with image-cycle chevrons
  if (curPages.length > 1) {
    const strip = document.createElement("div");
    strip.className = "strip";
    const chev = (dir, glyph) => {
      const b = document.createElement("button");
      b.className = "chev";
      b.textContent = glyph;
      b.title = (dir < 0 ? "Previous" : "Next") + " image (" + (dir < 0 ? "↑" : "↓") + ")";
      b.onclick = e => { e.stopPropagation(); cycleImage(dir); };
      return b;
    };
    strip.appendChild(chev(-1, "◀"));
    curPages.forEach((pg, i) => {
      const t = document.createElement("img");
      t.className = "dot" + (i === curPage ? " active" : "");
      t.src = imgUrl(pg, 120);
      t.title = "Image " + (i + 1);
      t.onclick = () => { curPage = i; showPage(); };
      strip.appendChild(t);
    });
    strip.appendChild(chev(1, "▶"));
    stage.appendChild(strip);
  }
}

/* ---------- routing: view state lives in the URL hash ---------- */
/* records are addressed by ID (#id/MNHNL190878) so links stay valid even
   if the box name or the sequence within a box changes                */

const routeToHash = r => {
  if (r.view === "boxes") return "#boxes";
  if (r.view === "list") return "#list/" + encodeURIComponent(r.box);
  if (r.view === "byid") return "#id/" + encodeURIComponent(r.id);
  if (r.view === "viewer") {
    const unit = unitsIn(r.box)[r.idx];
    return unit ? "#id/" + encodeURIComponent(unit.id) : "#boxes";
  }
  return "#paste";
};

function hashToRoute(h) {
  const p = (h || "").replace(/^#/, "").split("/").map(decodeURIComponent);
  if (p[0] === "boxes") return { view: "boxes" };
  if (p[0] === "list" && p[1]) return { view: "list", box: p[1] };
  if (p[0] === "id" && p[1]) return { view: "byid", id: p[1].toUpperCase() };
  if (p[0] === "view" && p[1] && p[2] !== "")                  // legacy format
    return { view: "viewer", box: p[1], idx: parseInt(p[2], 10) };
  return { view: "paste" };
}

// resolve/drop routes that no longer match the loaded data
function validRoute(r) {
  if (r.view === "paste" || !UNITS.length) return { view: "paste" };
  if (r.view === "byid") {
    const u = UNITS.find(x => x.id === r.id);
    if (!u || !u.box) return { view: "boxes" };
    const idx = unitsIn(u.box).findIndex(x => x.id === u.id);
    return idx >= 0 ? { view: "viewer", box: u.box, idx } : { view: "boxes" };
  }
  if (r.view === "list") return unitsIn(r.box).length ? r : { view: "boxes" };
  if (r.view === "viewer") {
    const l = unitsIn(r.box);
    if (!l.length) return { view: "boxes" };
    return (Number.isInteger(r.idx) && r.idx >= 0 && r.idx < l.length) ? r : { view: "list", box: r.box };
  }
  return { view: "boxes" };
}

function setRoute(r) {
  route = validRoute(r);            // normalize, then sync the hash
  const h = routeToHash(route);
  if (location.hash === h) render();
  else location.hash = h;            // hashchange listener renders
}

/* ---------- load-on-the-fly: #id/… links work without preloaded data ---------- */

// make sure a record is in UNITS; fetch its manifest to get the box
async function ensureLoaded(id) {
  if (UNITS.some(u => u.id === id)) return;
  const unit = { id };
  UNITS.push(unit);
  try { unit.box = boxOf(await getManifest(id)) || OTHER_BOX; }
  catch { unit.box = OTHER_BOX; }    // viewer will show the load error
  localStorage.setItem(LS_UNITS, JSON.stringify(UNITS));
}

async function openRecordUrl(id) {
  crumb.textContent = "";
  app.innerHTML = `<p style="text-align:center;color:var(--muted);padding:30px">Loading ${id}…</p>`;
  await ensureLoaded(id);
  route = validRoute({ view: "byid", id });
  render();
}

window.addEventListener("hashchange", () => {
  const r = hashToRoute(location.hash);
  if (r.view === "byid" && !UNITS.some(u => u.id === r.id)) {
    openRecordUrl(r.id);            // record not loaded yet → fetch it
    return;
  }
  route = validRoute(r);
  render();
});

window.go = v => setRoute(v === "boxes" ? { view: "boxes" }
                     : v === "list" ? { view: "list", box: route.box }
                     : { view: "paste" });
window.openBox = b => setRoute({ view: "list", box: b });
window.openBoxIdx = i => openBox(boxNames()[i]);
window.openBoxIndex = i => setRoute({ view: "viewer", box: route.box, idx: i });
window.nav = d => {
  const list = unitsIn(route.box);
  const n = route.idx + d;
  if (n < 0 || n >= list.length) return;
  setRoute({ view: "viewer", box: route.box, idx: n });
};
window.cycleImage = d => {
  if (!curPages.length) return;
  curPage = (curPage + d + curPages.length) % curPages.length;
  showPage();
};

/* ---------- bookmarked state ---------- */

window.toggleBookmark = () => {
  if (route.view !== "viewer") return;
  const unit = unitsIn(route.box)[route.idx];
  if (!unit) return;
  if (bookmarks.has(unit.id)) bookmarks.delete(unit.id); else bookmarks.add(unit.id);
  saveBookmarks();
  const on = bookmarks.has(unit.id);
  const btn = document.getElementById("markBtn");
  if (btn) btn.textContent = on ? "★ Bookmarked — undo (B)" : "Bookmark (B)";
  const badge = document.getElementById("bkBadge");
  if (badge) badge.style.display = on ? "inline-block" : "none";
};

/* ---------- keyboard help overlay ---------- */

window.toggleHelp = () => {
  const existing = document.getElementById("helpOverlay");
  if (existing) { existing.remove(); return; }
  const ov = document.createElement("div");
  ov.id = "helpOverlay";
  ov.className = "helpoverlay";
  const panel = document.createElement("div");
  panel.className = "panel";
  const h = document.createElement("h2");
  h.textContent = "Keyboard shortcuts";
  const table = document.createElement("table");
  [["→ / Space", "next specimen"],
   ["←", "previous specimen"],
   ["↑ / ↓", "previous / next image of this specimen"],
   ["B", "bookmark current specimen for later checking (toggle)"],
   ["+ / −", "zoom in / out"],
   ["Esc", "reset zoom / close this help"],
   ["?", "toggle this help"],
   ["Click image", "zoom in at that point (click again to reset)"],
   ["Drag · wheel · pinch", "pan and zoom"]]
   .forEach(([k, v]) => {
     const tr = document.createElement("tr");
     const td1 = document.createElement("td"); td1.className = "k"; td1.textContent = k;
     const td2 = document.createElement("td"); td2.className = "v"; td2.textContent = v;
     tr.append(td1, td2);
     table.appendChild(tr);
   });
  const close = document.createElement("button");
  close.className = "close"; close.textContent = "Close";
  close.onclick = () => ov.remove();
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  panel.append(h, table, close);
  ov.appendChild(panel);
  document.body.appendChild(ov);
};

document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if (e.key === "?") { e.preventDefault(); toggleHelp(); return; }
  if (e.key === "Escape") {
    const ov = document.getElementById("helpOverlay");
    if (ov) { ov.remove(); return; }
    if (route.view === "viewer" && applyZoom) { zoom = { scale: 1, tx: 0, ty: 0 }; applyZoom(); }
    return;
  }
  if (route.view !== "viewer") return;
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); nav(1); }
  else if (e.key === "ArrowLeft") nav(-1);
  else if (e.key === "ArrowUp") { e.preventDefault(); cycleImage(-1); }
  else if (e.key === "ArrowDown") { e.preventDefault(); cycleImage(1); }
  else if (e.key === "b" || e.key === "B") toggleBookmark();
  else if ((e.key === "+" || e.key === "=") && stageZoomAt) {
    const r = document.getElementById("stage").getBoundingClientRect();
    stageZoomAt(zoom.scale * 1.35, r.left + r.width / 2, r.top + r.height / 2);
  }
  else if (e.key === "-" && stageZoomAt) {
    const r = document.getElementById("stage").getBoundingClientRect();
    stageZoomAt(zoom.scale / 1.35, r.left + r.width / 2, r.top + r.height / 2);
  }
});

function render() {
  if (route.view === "paste") renderPaste();
  else if (route.view === "boxes") renderBoxes();
  else if (route.view === "list") renderList();
  else renderViewer();
}

/* ---------- boot: restore session, resolve boxes, follow the URL hash ---------- */
(async () => {
  const restored = restoreUnits();
  if (restored && UNITS.some(u => !u.box)) {         // saved before boxes were resolved
    crumb.textContent = "";
    app.innerHTML = `<p style="text-align:center;color:var(--muted);padding:30px">Reading boxes from manifests…</p>`;
    await resolveBoxes(UNITS);
  }
  const hr = location.hash ? hashToRoute(location.hash) : null;
  if (hr && hr.view === "byid" && !UNITS.some(u => u.id === hr.id)) {
    await ensureLoaded(hr.id);                       // #id/… link → load on the fly
  }
  if (restored || (hr && hr.view === "byid")) {
    route = validRoute(hr || { view: "boxes" });
    history.replaceState(null, "", routeToHash(route));
  } else {
    route = { view: "paste" };
  }
  render();
})();
</script>
</body>
</html>
