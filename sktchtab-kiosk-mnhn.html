<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sketchfab Museum Kiosk</title>

    <!-- =========================================================
         GOOGLE FONT — INTER
         ========================================================= -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- =========================================================
         SKETCHFAB VIEWER API
         ========================================================= -->

    <script src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>

    <style>

        /* =========================================================
           THEME
           ========================================================= */

        :root {

            --bg-color: #001c26;

            --text-color: #ffffff;

            --card-bg: #0b2a33;

            --border-color:
                rgba(255, 255, 255, 0.12);

            --accent-purple: #9999cc;

            --accent-red: #FF6666;

            --accent-green: #99cc99;

            --border-radius: 12px;

            --spacing: 20px;

            --page-padding: 20px;

            --columns: 4;

            --rows: 3;

            --title-size: 1rem;

            --title-weight: 500;

            --navigation-font-size: 1.15rem;

        }


        /* =========================================================
           GLOBAL RESET
           ========================================================= */

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

            user-select: none;

            -webkit-user-select: none;

            -moz-user-select: none;

            -ms-user-select: none;

            -webkit-touch-callout: none;

        }


        html,
        body {

            width: 100%;

            height: 100%;

            overflow: hidden;

        }


        body {

            font-family:
                'Inter',
                Arial,
                sans-serif;

            background:
                var(--bg-color);

            color:
                var(--text-color);

            width: 100vw;

            height: 100vh;

            overflow: hidden;

            touch-action: manipulation;

        }


        /* =========================================================
           GALLERY PAGE
           ========================================================= */

        #gallery-page {

            position: relative;

            width: 100vw;

            height: 100vh;

            padding:
                var(--page-padding);

            overflow: hidden;

            background:
                var(--bg-color);

        }


        /* =========================================================
           GALLERY GRID
           ========================================================= */

        #gallery {

            width: 100%;

            height: 100%;

            display: grid;

            grid-template-columns:
                repeat(
                    var(--columns),
                    minmax(0, 1fr)
                );

            grid-template-rows:
                repeat(
                    var(--rows),
                    minmax(0, 1fr)
                );

            gap:
                var(--spacing);

            overflow: hidden;

        }


        /* =========================================================
           MODEL CARD
           ========================================================= */

        .card {

            position: relative;

            background:
                var(--card-bg);

            border-radius:
                var(--border-radius);

            overflow: hidden;

            cursor: pointer;

            min-width: 0;

            min-height: 0;

            touch-action: manipulation;

            border:
                1px solid
                var(--border-color);

            transition:
                transform 200ms ease,
                box-shadow 200ms ease,
                border-color 200ms ease;

        }


        .card:hover {

            border-color:
                rgba(
                    153,
                    153,
                    204,
                    0.7
                );

            box-shadow:
                0 6px 20px
                rgba(0, 0, 0, 0.25);

        }


        .card:active {

            transform:
                scale(0.98);

        }


        /* =========================================================
           FEATURED CARD
           ========================================================= */

        .card.featured {

            grid-column:
                1 / span 2;

            grid-row:
                1 / span 2;

        }


        /* =========================================================
           CARD IMAGE
           ========================================================= */

        .card img {

            display: block;

            width: 100%;

            height: 100%;

            object-fit: cover;

            background:
                #163840;

            pointer-events: none;

        }


        /* =========================================================
           CARD TITLE
           ========================================================= */

        .card-title {

            position: absolute;

            left: 0;

            right: 0;

            bottom: 0;

            padding:
                30px 16px 14px 16px;

            background:
                linear-gradient(
                    to top,
                    rgba(0, 28, 38, 0.95),
                    rgba(0, 28, 38, 0.65),
                    rgba(0, 28, 38, 0)
                );

            font-family:
                'Inter',
                Arial,
                sans-serif;

            font-size:
                var(--title-size);

            font-weight:
                var(--title-weight);

            line-height:
                1.3;

            color:
                #ffffff;

            text-align:
                center;

            pointer-events:
                none;

        }


        /* =========================================================
           NAVIGATION TILE
           ========================================================= */

        .navigation-card {

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            width: 100%;

            height: 100%;

            padding: 0;

            border-radius:
                var(--border-radius);

            background:
                rgba(
                    153,
                    153,
                    204,
                    0.12
                );

            border:
                2px solid
                var(--accent-purple);

            color:
                var(--accent-purple);

            font-family:
                'Inter',
                Arial,
                sans-serif;

            font-size:
                var(--navigation-font-size);

            font-weight:
                600;

            cursor:
                pointer;

            touch-action:
                manipulation;

            transition:
                background 150ms ease,
                color 150ms ease,
                transform 150ms ease;

            appearance:
                none;

            -webkit-appearance:
                none;

        }


        .navigation-card:hover {

            background:
                var(--accent-purple);

            color:
                var(--bg-color);

        }


        .navigation-card:active {

            transform:
                scale(0.97);

        }


        /* =========================================================
           NEXT BUTTON
           ========================================================= */

        .navigation-card.next {

            border-color:
                var(--accent-green);

            color:
                var(--accent-green);

            background:
                rgba(
                    153,
                    204,
                    153,
                    0.10
                );

        }


        .navigation-card.next:hover {

            background:
                var(--accent-green);

            color:
                var(--bg-color);

        }


        /* =========================================================
           BACK BUTTON — GALLERY
           ========================================================= */

        .navigation-card.back {

            border-color:
                var(--accent-purple);

            color:
                var(--accent-purple);

            background:
                rgba(
                    153,
                    153,
                    204,
                    0.10
                );

        }


        .navigation-card.back:hover {

            background:
                var(--accent-purple);

            color:
                var(--bg-color);

        }


        /* =========================================================
           VIEWER
           ========================================================= */

        #viewer {

            display:
                none;

            position:
                fixed;

            inset:
                0;

            width:
                100vw;

            height:
                100vh;

            background:
                #000;

            z-index:
                100;

            overflow:
                hidden;

        }


        /* =========================================================
           BACK BUTTON IN SKETCHFAB VIEWER
           ========================================================= */

        #back {

            position:
                absolute;

            top:
                15px;

            left:
                15px;

            z-index:
                1000;

            display:
                block;

            padding:
                12px 18px;

            margin:
                0;

            background:
                var(--accent-purple);

            border:
                none;

            outline:
                none;

            color:
                var(--bg-color);

            font-family:
                'Inter',
                Arial,
                sans-serif;

            font-size:
                1rem;

            font-weight:
                600;

            cursor:
                pointer;

            border-radius:
                var(--border-radius);

            touch-action:
                manipulation;

            pointer-events:
                auto;

            -webkit-tap-highlight-color:
                transparent;

        }


        #back:hover {

            background:
                var(--accent-green);

        }


        #back:active {

            transform:
                scale(0.96);

        }


        #back:focus {

            outline:
                none;

        }


        /* =========================================================
           VIEW MODE BUTTONS (lower right of viewer)
           ========================================================= */

        #view-modes {

            position:
                absolute;

            right:
                0;

            bottom:
                0;

            z-index:
                1000;

            display:
                flex;

            gap:
                10px;

            padding:
                15px;

            /* Opaque so it also covers Sketchfab's own Inspector icon underneath */
            background:
                rgba(0, 28, 38, 0.92);

            border-top-left-radius:
                var(--border-radius);

        }


        .view-mode-btn {

            padding:
                12px 18px;

            background:
                rgba(153, 153, 204, 0.12);

            border:
                2px solid
                var(--accent-purple);

            border-radius:
                var(--border-radius);

            color:
                var(--accent-purple);

            font-family:
                'Inter',
                Arial,
                sans-serif;

            font-size:
                1rem;

            font-weight:
                600;

            cursor:
                pointer;

            touch-action:
                manipulation;

            -webkit-tap-highlight-color:
                transparent;

            appearance:
                none;

            -webkit-appearance:
                none;

            transition:
                background 150ms ease,
                color 150ms ease,
                transform 150ms ease;

        }


        .view-mode-btn.active {

            background:
                var(--accent-green);

            border-color:
                var(--accent-green);

            color:
                var(--bg-color);

        }


        .view-mode-btn:active {

            transform:
                scale(0.96);

        }


        .view-mode-btn:disabled {

            opacity:
                0.4;

            pointer-events:
                none;

        }


        /* =========================================================
           IFRAME WRAPPER
           ========================================================= */

        #iframe-wrapper {

            position:
                absolute;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            background:
                #000;

            z-index:
                100;

        }


        /* =========================================================
           IFRAME
           ========================================================= */

        #iframe {

            position:
                absolute;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            border:
                0;

            display:
                block;

            pointer-events:
                auto;

        }


        /* =========================================================
           SMALL SCREEN
           ========================================================= */

        @media (max-width: 800px) {

            :root {

                --spacing:
                    10px;

                --page-padding:
                    10px;

                --navigation-font-size:
                    0.95rem;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================================
         GALLERY
         ========================================================= -->

    <div id="gallery-page">

        <div id="gallery"></div>

    </div>


    <!-- =========================================================
         VIEWER
         ========================================================= -->

    <div id="viewer">

        <!--
             IMPORTANT:
             This button is outside the iframe.
             It therefore controls the parent page and can
             close the Sketchfab viewer.
        -->

        <button
            id="back"
            type="button"
            aria-label="Back to gallery"
        >
            ← Back
        </button>


        <!--
             VIEW MODE BUTTONS
             Also outside the iframe, lower right.
        -->

        <div id="view-modes">

            <button
                type="button"
                class="view-mode-btn active"
                data-mode="textures"
            >Textures</button>

            <button
                type="button"
                class="view-mode-btn"
                data-mode="wireframe"
            >Wireframe</button>

        </div>


        <div id="iframe-wrapper">

            <iframe
                id="iframe"
                title="Sketchfab 3D Viewer"
                frameborder="0"
                allowfullscreen
                mozallowfullscreen="true"
                webkitallowfullscreen="true"
                allow="autoplay; fullscreen; xr-spatial-tracking"
                xr-spatial-tracking
                execution-while-out-of-viewport
                execution-while-not-rendered
                web-share
            ></iframe>

        </div>

    </div>


    <script>

        /* =========================================================
           MODEL IDS
           ========================================================= */

        const MODEL_IDS = [

            'cb5c4933e8f44a219cdf692b6357d077', /*small model*/
            'df1dcc1d9f6a4097895eba89607079ae', /*small model*/
            '41cc540a01ef4a48a393dae5655bdfaf', /*small model*/
            '4ce63fd5ebf64ef595a6a839a377a4ce', /*small model*/
            '125391c966a040a2beb013daf1756c0c', /*small model*/
            '96c51de7d55349e8a83baac1bae027d0', /*small model*/
            'a8c57c7cca514074a7463d8c1ae53ea7', /*small model*/
            '6c60cea6004d4058babc6109d028f663', /*small model*/
            '6e1b5e5711af4ca7a4521ac21d08d3e3', /*small model*/
            'd3563446f47643088a619961663d57f8', /*small model*/
            '57a13eb884a04652b616fee456d07675', /*small model*/
            '5420e281ec504d1ba53525631aee3bee', /*small model*/
            '09b3764172424b9f9a14e6b2e455fc80', /*small model*/
            '18b507d3b6274edf868cbab2c594a5f7', /*small model*/
            'c4603779133649b280ff0489d59564d4', /*small model*/
            'f9d0925f6db34f3fb381bcd79e41ccd2', /*small model*/
            'e5fa002641f04c318836b1ceae20d4d0', /*small model*/
            '848516fa43034f519d300e4443ca6f65', /*small model*/
            '9d55e4c5a6784c3db24e47c947963ddb' /*small model*/

        ];


        /* =========================================================
           PAGINATION
           ========================================================= */

        const FIRST_PAGE_MODELS = 9;

        const NORMAL_PAGE_MODELS = 12;

        let currentPage = 0;

        let totalPages = 1;

        let allModels = [];


        /* =========================================================
           PLACEHOLDER IMAGE
           ========================================================= */

        const placeholderImage =
            'data:image/svg+xml;utf8,' +
            '<svg xmlns="http://www.w3.org/2000/svg" ' +
            'width="1920" height="1080" ' +
            'viewBox="0 0 1920 1080">' +
            '<rect width="1920" height="1080" ' +
            'fill="%23163840"/>' +
            '</svg>';


        /* =========================================================
           CALCULATE TOTAL PAGES
           ========================================================= */

        function calculateTotalPages() {

            if (
                allModels.length <=
                FIRST_PAGE_MODELS
            ) {

                return 1;

            }

            return (
                1 +
                Math.ceil(
                    (
                        allModels.length -
                        FIRST_PAGE_MODELS
                    ) /
                    NORMAL_PAGE_MODELS
                )
            );

        }


        /* =========================================================
           GET PAGE MODELS
           ========================================================= */

        function getPageModels(page) {

            if (
                page === 0
            ) {

                return allModels.slice(
                    0,
                    FIRST_PAGE_MODELS
                );

            }

            const start =
                FIRST_PAGE_MODELS +
                (
                    page - 1
                ) *
                NORMAL_PAGE_MODELS;

            return allModels.slice(
                start,
                start + NORMAL_PAGE_MODELS
            );

        }


        /* =========================================================
           FETCH MODEL METADATA
           ========================================================= */

        async function fetchModelsMetadata() {

            const models = [];

            for (
                const modelId of MODEL_IDS
            ) {

                try {

                    const response =
                        await fetch(
                            `https://api.sketchfab.com/v3/models/${modelId}`
                        );

                    if (
                        !response.ok
                    ) {

                        throw new Error(
                            `HTTP ${response.status}`
                        );

                    }

                    const data =
                        await response.json();

                    models.push({

                        uid:
                            modelId,

                        title:
                            data.name ||
                            'Untitled',

                        thumbnail:
                            data.thumbnails
                                ?.images?.[0]?.url ||
                            null

                    });

                } catch (error) {

                    console.error(
                        `Failed to fetch model ${modelId}:`,
                        error
                    );

                    models.push({

                        uid:
                            modelId,

                        title:
                            'Untitled',

                        thumbnail:
                            null

                    });

                }

            }

            return models;

        }


        /* =========================================================
           CREATE MODEL CARD
           ========================================================= */

        function createModelCard(model) {

            const card =
                document.createElement(
                    'div'
                );

            card.className =
                'card';

            const image =
                document.createElement(
                    'img'
                );

            image.src =
                model.thumbnail ||
                placeholderImage;

            image.alt =
                model.title;

            image.draggable =
                false;

            const title =
                document.createElement(
                    'div'
                );

            title.className =
                'card-title';

            title.textContent =
                model.title;

            card.appendChild(
                image
            );

            card.appendChild(
                title
            );

            card.addEventListener(
                'click',
                () => {

                    openModel(
                        model.uid,
                        model.title
                    );

                }
            );

            return card;

        }


        /* =========================================================
           CREATE NAVIGATION CARD
           ========================================================= */

        function createNavigationCard(
            type
        ) {

            const card =
                document.createElement(
                    'button'
                );

            card.type =
                'button';

            card.className =
                'navigation-card';

            if (
                type === 'next'
            ) {

                card.classList.add(
                    'next'
                );

                card.innerHTML =
                    'Next&nbsp;&nbsp;→';

                card.addEventListener(
                    'click',
                    nextPage
                );

            }

            if (
                type === 'back'
            ) {

                card.classList.add(
                    'back'
                );

                card.innerHTML =
                    '←&nbsp;&nbsp;Back';

                card.addEventListener(
                    'click',
                    previousPage
                );

            }

            return card;

        }


        /* =========================================================
           RENDER PAGE 1
           ========================================================= */

        function renderFirstPage(
            pageModels
        ) {

            const gallery =
                document.getElementById(
                    'gallery'
                );

            if (
                pageModels.length > 0
            ) {

                const featured =
                    createModelCard(
                        pageModels[0]
                    );

                featured.classList.add(
                    'featured'
                );

                gallery.appendChild(
                    featured
                );

            }

            for (
                let i = 1;
                i < pageModels.length;
                i++
            ) {

                if (
                    i === pageModels.length - 1 &&
                    totalPages > 1
                ) {

                    gallery.appendChild(
                        createNavigationCard(
                            'next'
                        )
                    );

                    continue;

                }

                gallery.appendChild(
                    createModelCard(
                        pageModels[i]
                    )
                );

            }

        }


        /* =========================================================
           RENDER NORMAL PAGE
           ========================================================= */

        function renderNormalPage(
            pageModels
        ) {

            const gallery =
                document.getElementById(
                    'gallery'
                );

            const isLastPage =
                currentPage ===
                totalPages - 1;

            const backCard =
                createNavigationCard(
                    'back'
                );

            backCard.style.gridColumn =
                '1';

            backCard.style.gridRow =
                '3';

            gallery.appendChild(
                backCard
            );


            const modelPositions = [

                {
                    column: 1,
                    row: 1
                },

                {
                    column: 2,
                    row: 1
                },

                {
                    column: 3,
                    row: 1
                },

                {
                    column: 4,
                    row: 1
                },

                {
                    column: 1,
                    row: 2
                },

                {
                    column: 2,
                    row: 2
                },

                {
                    column: 3,
                    row: 2
                },

                {
                    column: 4,
                    row: 2
                },

                {
                    column: 2,
                    row: 3
                },

                {
                    column: 3,
                    row: 3
                }

            ];


            if (
                isLastPage
            ) {

                modelPositions.push({

                    column: 4,
                    row: 3

                });

            }


            pageModels.forEach(
                (model, index) => {

                    if (
                        !modelPositions[index]
                    ) {

                        return;

                    }

                    const position =
                        modelPositions[index];

                    const card =
                        createModelCard(
                            model
                        );

                    card.style.gridColumn =
                        position.column;

                    card.style.gridRow =
                        position.row;

                    gallery.appendChild(
                        card
                    );

                }
            );


            if (
                !isLastPage
            ) {

                const nextCard =
                    createNavigationCard(
                        'next'
                    );

                nextCard.style.gridColumn =
                    '4';

                nextCard.style.gridRow =
                    '3';

                gallery.appendChild(
                    nextCard
                );

            }

        }


        /* =========================================================
           RENDER CURRENT PAGE
           ========================================================= */

        function renderPage() {

            const gallery =
                document.getElementById(
                    'gallery'
                );

            gallery.innerHTML =
                '';

            const pageModels =
                getPageModels(
                    currentPage
                );

            if (
                currentPage === 0
            ) {

                renderFirstPage(
                    pageModels
                );

            } else {

                renderNormalPage(
                    pageModels
                );

            }

        }


        /* =========================================================
           NEXT PAGE
           ========================================================= */

        function nextPage() {

            if (
                currentPage <
                totalPages - 1
            ) {

                currentPage++;

                renderPage();

                resetIdleTimer();

            }

        }


        /* =========================================================
           PREVIOUS PAGE
           ========================================================= */

        function previousPage() {

            if (
                currentPage > 0
            ) {

                currentPage--;

                renderPage();

                resetIdleTimer();

            }

        }


        /* =========================================================
           VIEW MODES (textures / wireframe)
           ========================================================= */

        /* Wireframe line colour, RRGGBBAA (black) */
        const WIREFRAME_COLOR =
            '000000FF';

        /* Surface colour of the untextured model in wireframe view */
        const CLAY_COLOR =
            [0.78, 0.78, 0.78];

        /* Material channels that hold the base colour / texture */
        const COLOR_CHANNELS =
            ['AlbedoPBR', 'DiffuseColor', 'DiffusePBR'];

        /* Sketchfab Viewer API instance of the open model */
        let viewerApi =
            null;

        /* Guards against late callbacks after the viewer was closed */
        let viewerSession =
            0;

        /* Original materials of the open model (for restoring textures) */
        let originalMaterials =
            null;

        let currentMode =
            'textures';

        let modeBusy =
            false;

        let modeBusyTimer =
            null;


        function updateModeButtons(
            activeMode
        ) {

            document
                .querySelectorAll(
                    '.view-mode-btn'
                )
                .forEach(
                    btn => {

                        btn.classList.toggle(
                            'active',
                            btn.dataset.mode ===
                            activeMode
                        );

                    }
                );

        }


        function setModeButtonsEnabled(
            enabled
        ) {

            document
                .querySelectorAll(
                    '.view-mode-btn'
                )
                .forEach(
                    btn => {

                        btn.disabled =
                            !enabled;

                    }
                );

        }


        function finishModeChange() {

            clearTimeout(
                modeBusyTimer
            );

            modeBusy =
                false;

            if (
                viewerApi
            ) {

                setModeButtonsEnabled(
                    true
                );

            }

        }


        /*
         * Sends every material to the viewer and calls
         * done(error) when all of them have been applied.
         */
        function applyMaterials(
            api,
            materials,
            done
        ) {

            let pending =
                materials.length;

            let failure =
                null;

            if (
                pending === 0
            ) {

                done(null);

                return;

            }

            materials.forEach(
                material => {

                    api.setMaterial(
                        material,
                        err => {

                            if (
                                err
                            ) {

                                failure =
                                    err;

                            }

                            pending--;

                            if (
                                pending === 0
                            ) {

                                done(failure);

                            }

                        }
                    );

                }
            );

        }


        /*
         * WIREFRAME VIEW:
         * remove textures (plain grey surface) + black wireframe.
         */
        function showWireframeView(
            api,
            done
        ) {

            api.getMaterialList(
                (err, materials) => {

                    if (
                        err
                    ) {

                        done(err);

                        return;

                    }

                    /* Keep the originals once, so textures can be restored */
                    if (
                        !originalMaterials
                    ) {

                        originalMaterials =
                            JSON.parse(
                                JSON.stringify(
                                    materials
                                )
                            );

                    }

                    materials.forEach(
                        material => {

                            COLOR_CHANNELS.forEach(
                                name => {

                                    const channel =
                                        material.channels[name];

                                    if (
                                        channel
                                    ) {

                                        channel.enable =
                                            true;

                                        delete channel.texture;

                                        channel.color =
                                            CLAY_COLOR.slice();

                                    }

                                }
                            );

                            if (
                                material.channels.EmitColor
                            ) {

                                material.channels.EmitColor.enable =
                                    false;

                            }

                        }
                    );

                    applyMaterials(
                        api,
                        materials,
                        applyError => {

                            if (
                                applyError
                            ) {

                                done(applyError);

                                return;

                            }

                            api.setWireframe(
                                true,
                                {
                                    color:
                                        WIREFRAME_COLOR
                                },
                                done
                            );

                        }
                    );

                }
            );

        }


        /*
         * TEXTURE VIEW:
         * wireframe off + original materials restored.
         */
        function showTextureView(
            api,
            done
        ) {

            api.setWireframe(
                false,
                {},
                err => {

                    if (
                        err
                    ) {

                        console.warn(
                            'setWireframe failed:',
                            err
                        );

                    }

                    if (
                        !originalMaterials
                    ) {

                        done(null);

                        return;

                    }

                    applyMaterials(
                        api,
                        JSON.parse(
                            JSON.stringify(
                                originalMaterials
                            )
                        ),
                        done
                    );

                }
            );

        }


        function applyViewMode(
            mode
        ) {

            if (
                !viewerApi ||
                modeBusy ||
                mode === currentMode
            ) {

                return;

            }

            const api =
                viewerApi;

            modeBusy =
                true;

            setModeButtonsEnabled(
                false
            );

            /* Safety net: never leave the buttons locked */
            modeBusyTimer =
                setTimeout(
                    finishModeChange,
                    8000
                );

            const finished =
                err => {

                    if (
                        err
                    ) {

                        console.warn(
                            'View mode change failed:',
                            err
                        );

                    }

                    /* Viewer was closed or replaced meanwhile */
                    if (
                        viewerApi !== api
                    ) {

                        return;

                    }

                    currentMode =
                        mode;

                    updateModeButtons(
                        mode
                    );

                    finishModeChange();

                };

            if (
                mode === 'wireframe'
            ) {

                showWireframeView(
                    api,
                    finished
                );

            } else {

                showTextureView(
                    api,
                    finished
                );

            }

        }


        function setupViewModeButtons() {

            document
                .querySelectorAll(
                    '.view-mode-btn'
                )
                .forEach(
                    btn => {

                        btn.addEventListener(
                            'click',
                            function(event) {

                                event.preventDefault();

                                event.stopPropagation();

                                applyViewMode(
                                    btn.dataset.mode
                                );

                            }
                        );

                    }
                );

        }


        function resetViewModeState() {

            viewerApi =
                null;

            originalMaterials =
                null;

            currentMode =
                'textures';

            modeBusy =
                false;

            clearTimeout(
                modeBusyTimer
            );

        }


        /* =========================================================
           OPEN MODEL
           ========================================================= */

        function openModel(
            uid,
            title
        ) {

            const viewer =
                document.getElementById(
                    'viewer'
                );

            const iframe =
                document.getElementById(
                    'iframe'
                );

            const session =
                ++viewerSession;

            resetViewModeState();

            setModeButtonsEnabled(
                false
            );

            updateModeButtons(
                'textures'
            );


            /*
             * Show the viewer.
             */

            viewer.style.display =
                'block';


            /*
             * Initialise the Sketchfab Viewer API on the iframe.
             * This sets the iframe source itself.
             *
             * NOTE: ui_inspector is intentionally NOT set, because
             * setWireframe() does not work with ui_inspector: 0.
             * The Inspector icon is hidden behind the #view-modes bar.
             */

            const client =
                new Sketchfab(
                    '1.12.1',
                    iframe
                );

            client.init(
                uid,
                {

                    autostart: 1,

                    ui_animations: 0,

                    ui_infos: 0,

                    ui_stop: 0,

                    ui_watermark_link: 0,

                    ui_watermark: 0,

                    ui_ar: 0,

                    ui_help: 0,

                    ui_settings: 0,

                    ui_vr: 0,

                    ui_fullscreen: 0,

                    ui_annotations: 0,

                    success: function(api) {

                        /* Viewer was closed in the meantime */
                        if (
                            session !==
                            viewerSession
                        ) {

                            return;

                        }

                        api.addEventListener(
                            'viewerready',
                            function() {

                                if (
                                    session !==
                                    viewerSession
                                ) {

                                    return;

                                }

                                viewerApi =
                                    api;

                                setModeButtonsEnabled(
                                    true
                                );

                            }
                        );

                    },

                    error: function() {

                        console.error(
                            'Sketchfab viewer failed to initialise'
                        );

                    }

                }
            );


            /*
             * Start the idle timer.
             */

            resetIdleTimer();

        }


        /* =========================================================
           CLOSE VIEWER
           ========================================================= */

        function closeViewer() {

            const viewer =
                document.getElementById(
                    'viewer'
                );

            const iframe =
                document.getElementById(
                    'iframe'
                );


            /*
             * Invalidate pending Viewer API callbacks.
             */

            viewerSession++;

            resetViewModeState();


            /*
             * Stop the Sketchfab iframe completely.
             *
             * This is important because simply hiding the iframe
             * can leave the 3D viewer running in the background.
             */

            iframe.src =
                '';


            /*
             * Hide the viewer.
             */

            viewer.style.display =
                'none';


            /*
             * Stop the idle timer.
             */

            clearTimeout(
                idleTimer
            );

        }


        /* =========================================================
           VIEWER BACK BUTTON
           ========================================================= */

        function setupViewerBackButton() {

            const backButton =
                document.getElementById(
                    'back'
                );


            /*
             * Normal mouse / click support.
             */

            backButton.addEventListener(
                'click',
                function(event) {

                    event.preventDefault();

                    event.stopPropagation();

                    closeViewer();

                }
            );


            /*
             * Extra pointer support for touchscreen kiosks.
             *
             * This makes the button respond reliably to touch
             * screens as well as a mouse.
             */

            backButton.addEventListener(
                'pointerup',
                function(event) {

                    event.preventDefault();

                    event.stopPropagation();

                }
            );

        }


        /* =========================================================
           IDLE TIMER
           ========================================================= */

        let idleTimer =
            null;

        const IDLE_TIME =
            90000;


        function resetIdleTimer() {

            clearTimeout(
                idleTimer
            );

            const viewer =
                document.getElementById(
                    'viewer'
                );

            if (
                viewer.style.display !==
                'block'
            ) {

                return;

            }

            idleTimer =
                setTimeout(
                    closeViewer,
                    IDLE_TIME
                );

        }


        /* =========================================================
           POINTER ACTIVITY
           ========================================================= */

        document.addEventListener(
            'pointerdown',
            function(event) {

                /*
                 * Do not interfere with the viewer Back button.
                 */

                if (
                    event.target.id ===
                    'back'
                ) {

                    return;

                }

                resetIdleTimer();

            },
            {
                passive: true
            }
        );


        document.addEventListener(
            'pointermove',
            resetIdleTimer,
            {
                passive: true
            }
        );


        document.addEventListener(
            'touchstart',
            resetIdleTimer,
            {
                passive: true
            }
        );


        /* =========================================================
           CONTEXT MENU
           ========================================================= */

        document.addEventListener(
            'contextmenu',
            event => {

                event.preventDefault();

            }
        );


        /* =========================================================
           DRAGGING
           ========================================================= */

        document.addEventListener(
            'dragstart',
            event => {

                event.preventDefault();

            }
        );


        /* =========================================================
           KEYBOARD RESTRICTIONS
           ========================================================= */

        document.addEventListener(
            'keydown',
            event => {

                if (

                    event.key === 'F12' ||

                    (
                        event.ctrlKey &&
                        (
                            event.key.toLowerCase() === 'u' ||
                            event.key.toLowerCase() === 's' ||
                            event.key.toLowerCase() === 'c'
                        )
                    ) ||

                    (
                        event.metaKey &&
                        (
                            event.key.toLowerCase() === 'u' ||
                            event.key.toLowerCase() === 's' ||
                            event.key.toLowerCase() === 'c'
                        )
                    )

                ) {

                    event.preventDefault();

                    event.stopPropagation();

                }


                /* =================================================
                   ESCAPE — CLOSE VIEWER
                   ================================================= */

                if (
                    event.key === 'Escape'
                ) {

                    const viewer =
                        document.getElementById(
                            'viewer'
                        );

                    if (
                        viewer.style.display ===
                        'block'
                    ) {

                        event.preventDefault();

                        closeViewer();

                    }

                }

            }
        );


        /* =========================================================
           FULLSCREEN
           ========================================================= */

        function requestFullscreen() {

            const elem =
                document.documentElement;

            if (
                document.fullscreenElement
            ) {

                return;

            }

            if (
                elem.requestFullscreen
            ) {

                elem.requestFullscreen()
                    .catch(
                        error => {

                            console.warn(
                                'Fullscreen request was not accepted:',
                                error
                            );

                        }
                    );

            } else if (
                elem.webkitRequestFullscreen
            ) {

                elem.webkitRequestFullscreen();

            } else if (
                elem.msRequestFullscreen
            ) {

                elem.msRequestFullscreen();

            }

        }


        /* =========================================================
           INITIALIZE
           ========================================================= */

        document.addEventListener(
            'DOMContentLoaded',
            async () => {

                /*
                 * IMPORTANT:
                 *
                 * Connect the Back button to closeViewer()
                 * before the user can open a model.
                 */

                setupViewerBackButton();


                /*
                 * Connect the view-mode buttons
                 * (textures / wireframe).
                 */

                setupViewModeButtons();


                /*
                 * Fetch all Sketchfab metadata.
                 */

                allModels =
                    await fetchModelsMetadata();


                /*
                 * Calculate pages.
                 */

                totalPages =
                    calculateTotalPages();


                /*
                 * Start on page 1.
                 */

                currentPage =
                    0;


                /*
                 * Render gallery.
                 */

                renderPage();


                /*
                 * Request fullscreen.
                 */

                requestFullscreen();

            }
        );

    </script>

</body>

</html>
