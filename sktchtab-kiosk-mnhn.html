<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sketchfab Museum Kiosk</title>


    <!-- =========================================================
         GOOGLE FONT — INTER
         ========================================================= -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================================================
           THEME
           ========================================================= */

        :root {

            /*
             * Main museum/kiosk background
             */

            --bg-color: #001c26;


            /*
             * Text
             */

            --text-color: #ffffff;
            --muted-text-color: rgba(255, 255, 255, 0.75);


            /*
             * Card background
             */

            --card-bg: #0b2a33;


            /*
             * Accent colours
             */

            --accent-purple: #9999cc;
            --accent-red: #FF6666;
            --accent-green: #99cc99;


            /*
             * Borders / subtle UI
             */

            --border-color: rgba(255, 255, 255, 0.12);


            /*
             * Layout
             */

            --border-radius: 12px;

            --spacing: 20px;

            --page-padding: 20px;

            --columns: 4;

            --rows: 3;


            /*
             * IMPORTANT:
             *
             * This is the title size for EVERY card.
             *
             * Featured and normal cards intentionally
             * use the exact same title styling.
             */

            --title-size: 1.5rem;

            --title-weight: 500;


            /*
             * Navigation
             */

            --page-button-size: 60px;

        }


        /* =========================================================
           GLOBAL RESET
           ========================================================= */

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;


            user-select: none;

            -webkit-user-select: none;

            -moz-user-select: none;

            -ms-user-select: none;

            -webkit-touch-callout: none;

        }


        html,
        body {

            width: 100%;

            height: 100%;

            overflow: hidden;

        }


        body {

            font-family:
                'Inter',
                Arial,
                sans-serif;

            background:
                var(--bg-color);

            color:
                var(--text-color);

            width: 100vw;

            height: 100vh;

            overflow: hidden;

            touch-action: manipulation;

        }


        /* =========================================================
           GALLERY PAGE
           ========================================================= */

        #gallery-page {

            position: relative;

            width: 100vw;

            height: 100vh;

            padding:
                var(--page-padding);

            overflow: hidden;

            background:
                var(--bg-color);

        }


        /* =========================================================
           GALLERY GRID
           ========================================================= */

        #gallery {

            width: 100%;

            height: 100%;

            display: grid;

            grid-template-columns:
                repeat(
                    4,
                    minmax(0, 1fr)
                );

            grid-template-rows:
                repeat(
                    3,
                    minmax(0, 1fr)
                );

            gap:
                var(--spacing);

            overflow: hidden;

            grid-auto-flow: row;

        }


        /* =========================================================
           MODEL CARD
           ========================================================= */

        .card {

            position: relative;

            background:
                var(--card-bg);

            border-radius:
                var(--border-radius);

            overflow: hidden;

            cursor: pointer;

            min-width: 0;

            min-height: 0;

            touch-action: manipulation;

            border:
                1px solid
                var(--border-color);

            transition:
                transform 200ms ease,
                box-shadow 200ms ease,
                border-color 200ms ease;

        }


        .card:active {

            transform:
                scale(0.98);

        }


        /* =========================================================
           FEATURED CARD
           ========================================================= */

        /*
         * The featured card occupies exactly:
         *
         * 2 columns
         * 2 rows
         *
         * It is therefore a true 2x2 card.
         */

        .card.featured {

            grid-column:
                1 / span 2;

            grid-row:
                1 / span 2;

        }


        /* =========================================================
           CARD IMAGE
           ========================================================= */

        .card img {

            display: block;

            width: 100%;

            height: 100%;

            object-fit: cover;

            background:
                #163840;

            pointer-events: none;

        }


        /* =========================================================
           CARD TITLE
           ========================================================= */

        /*
         * IMPORTANT:
         *
         * There is ONLY ONE title style.
         *
         * The featured card does NOT override it.
         *
         * This guarantees that titles are always identical
         * regardless of card size.
         */

		.card-title {

			position: absolute;

			left: 0;
			right: 0;
			top: 0;

			padding: 14px 16px 30px 16px;

			background:
				linear-gradient(
					to bottom,
					rgba(0, 28, 38, 0.95),
					rgba(0, 28, 38, 0.65),
					rgba(0, 28, 38, 0)
				);

			font-family:
				'Inter',
				Arial,
				sans-serif;

			font-size:
				var(--title-size);

			font-weight:
				var(--title-weight);

			line-height:
				1.3;

			color:
				#ffffff;

			text-align:
				center;

			pointer-events:
				none;
		}


        /*
         * INTENTIONALLY NO:
         *
         * .card.featured .card-title
         *
         * override.
         *
         * This means the featured title is exactly the same
         * size as every other title.
         */


        /* =========================================================
           PAGE NAVIGATION
           ========================================================= */

        #page-navigation {

            position: absolute;

            left: 50%;

            bottom: 20px;

            transform:
                translateX(-50%);

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 15px;

            z-index: 5;

        }


        /* =========================================================
           NAVIGATION BUTTONS
           ========================================================= */

        #previous-page,
        #next-page {

            width:
                var(--page-button-size);

            height:
                var(--page-button-size);

            border:
                2px solid
                var(--accent-purple);

            border-radius:
                50%;

            background:
                var(--bg-color);

            color:
                var(--accent-purple);

            font-family:
                'Inter',
                Arial,
                sans-serif;

            font-size:
                1.8rem;

            font-weight:
                500;

            cursor:
                pointer;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            touch-action:
                manipulation;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.35);

            transition:
                background 150ms ease,
                color 150ms ease,
                transform 150ms ease;

        }


        #previous-page:hover,
        #next-page:hover {

            background:
                var(--accent-purple);

            color:
                var(--bg-color);

        }


        #previous-page:active,
        #next-page:active {

            transform:
                scale(0.92);

        }


        #previous-page:disabled,
        #next-page:disabled {

            opacity:
                0.25;

            cursor:
                default;

        }


        #previous-page:disabled:hover,
        #next-page:disabled:hover {

            background:
                var(--bg-color);

            color:
                var(--accent-purple);

        }


        /* =========================================================
           PAGE INDICATOR
           ========================================================= */

        #page-indicator {

            min-width:
                80px;

            padding:
                10px 15px;

            border-radius:
                20px;

            background:
                rgba(255, 255, 255, 0.08);

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            color:
                var(--text-color);

            font-family:
                'Inter',
                Arial,
                sans-serif;

            font-size:
                0.95rem;

            font-weight:
                500;

            text-align:
                center;

        }


        /* =========================================================
           VIEWER
           ========================================================= */

        #viewer {

            display:
                none;

            position:
                fixed;

            inset:
                0;

            width:
                100vw;

            height:
                100vh;

            background:
                #000;

            z-index:
                10;

            overflow:
                hidden;

        }


        /* =========================================================
           BACK BUTTON
           ========================================================= */

        #back {

            position:
                absolute;

            top:
                15px;

            left:
                15px;

            z-index:
                20;

            padding:
                12px 18px;

            background:
                var(--accent-purple);

            border:
                none;

            color:
                var(--bg-color);

            font-family:
                'Inter',
                Arial,
                sans-serif;

            font-size:
                1rem;

            font-weight:
                600;

            cursor:
                pointer;

            border-radius:
                var(--border-radius);

            touch-action:
                manipulation;

            transition:
                transform 150ms ease,
                background 150ms ease;

        }


        #back:hover {

            background:
                var(--accent-green);

        }


        #back:active {

            transform:
                scale(0.96);

        }


        /* =========================================================
           IFRAME
           ========================================================= */

        #iframe-wrapper {

            position:
                absolute;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            background:
                #000;

        }


        #iframe {

            position:
                absolute;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            border:
                0;

            display:
                block;

            pointer-events:
                auto;

        }


        /* =========================================================
           SMALL SCREEN
           ========================================================= */

        @media (max-width: 800px) {

            :root {

                --spacing: 10px;

                --page-padding: 10px;

                --title-size: 1rem;

            }


            #page-navigation {

                bottom:
                    10px;

            }


            #previous-page,
            #next-page {

                width:
                    50px;

                height:
                    50px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================================
         GALLERY
         ========================================================= -->

    <div id="gallery-page">

        <div id="gallery"></div>


        <!-- =====================================================
             PAGE NAVIGATION
             ===================================================== -->

        <div id="page-navigation">

            <button
                id="previous-page"
                type="button"
                aria-label="Previous page"
            >
                ←
            </button>


            <div id="page-indicator">
                1 / 1
            </div>


            <button
                id="next-page"
                type="button"
                aria-label="Next page"
            >
                →
            </button>

        </div>

    </div>


    <!-- =========================================================
         VIEWER
         ========================================================= -->

    <div id="viewer">

        <button
            id="back"
            type="button"
        >
            ← Back
        </button>


        <div id="iframe-wrapper">

            <iframe
                id="iframe"
                title="Sketchfab 3D Viewer"
                frameborder="0"
                allowfullscreen
                mozallowfullscreen="true"
                webkitallowfullscreen="true"
                allow="autoplay; fullscreen; xr-spatial-tracking"
                xr-spatial-tracking
                execution-while-out-of-viewport
                execution-while-not-rendered
                web-share
            ></iframe>

        </div>

    </div>


    <script>

        /* =========================================================
           MODEL IDS
           ========================================================= */

        const MODEL_IDS = [

            '56816fb55d054bdc9ecd6ea6b35b44c1',
            '1dc0a7826fdd4279b8041fab6c370d07',
            'ebc60a9ceed249f186bc42bf67799708',
            '1ef831b55161418fb94e2d710839cb4f',
            'b243b5da87494a11b63441f4620dbd26',
            '453bbfa99fd5472681f1cca37ef2a028',
            '377b3b9e288d4265b5de8d95f897a5eb',
            '90318595f90541af8ffb6b5edb855c77',
            '14651059da2b4c1db1ca296920a3062a',

            '14c2c0388b4547df9c68afe943417cf6',
            '36df73258ec14448b67ba1859051c55c',
            '457e199b78d6486585075aa9647f984f',
            '44f769f570fd462db821a6ce6c96ba7a',
            'e24c52fb47db43b286ac92153e771c2c',
            '9b26c1d0988944b8aa995efce447c00b',
            '2a4a2c6702494bb6a220576773ca5f94'

        ];


        /* =========================================================
           PAGINATION
           ========================================================= */

        const FIRST_PAGE_SIZE = 9;

        const NORMAL_PAGE_SIZE = 12;


        let currentPage = 0;

        let totalPages = 1;

        let allModels = [];


        /* =========================================================
           PLACEHOLDER
           ========================================================= */

        const placeholderImage =
            'data:image/svg+xml;utf8,' +
            '<svg xmlns="http://www.w3.org/2000/svg" ' +
            'width="1920" height="1080" viewBox="0 0 1920 1080">' +
            '<rect width="1920" height="1080" fill="%23163840"/>' +
            '</svg>';


        /* =========================================================
           PAGE SIZE
           ========================================================= */

        function getPageSize(page) {

            return page === 0
                ? FIRST_PAGE_SIZE
                : NORMAL_PAGE_SIZE;

        }


        /* =========================================================
           PAGE START
           ========================================================= */

        function getPageStart(page) {

            if (page === 0) {

                return 0;

            }


            return (
                FIRST_PAGE_SIZE +
                (page - 1) *
                NORMAL_PAGE_SIZE
            );

        }


        /* =========================================================
           TOTAL PAGES
           ========================================================= */

        function calculateTotalPages() {

            if (
                allModels.length === 0
            ) {

                return 1;

            }


            if (
                allModels.length <=
                FIRST_PAGE_SIZE
            ) {

                return 1;

            }


            const remaining =
                allModels.length -
                FIRST_PAGE_SIZE;


            return (
                1 +
                Math.ceil(
                    remaining /
                    NORMAL_PAGE_SIZE
                )
            );

        }


        /* =========================================================
           FETCH MODEL METADATA
           ========================================================= */

        async function fetchModelsMetadata() {

            const models = [];


            for (
                const modelId of MODEL_IDS
            ) {

                try {

                    const response =
                        await fetch(
                            `https://api.sketchfab.com/v3/models/${modelId}`
                        );


                    if (!response.ok) {

                        throw new Error(
                            `HTTP ${response.status}`
                        );

                    }


                    const data =
                        await response.json();


                    models.push({

                        uid:
                            modelId,

                        title:
                            data.name ||
                            'Untitled',

                        thumbnail:
                            data.thumbnails
                                ?.images?.[0]?.url ||
                            null

                    });


                } catch (error) {

                    console.error(
                        `Failed to fetch model ${modelId}:`,
                        error
                    );


                    models.push({

                        uid:
                            modelId,

                        title:
                            'Untitled',

                        thumbnail:
                            null

                    });

                }

            }


            return models;

        }


        /* =========================================================
           RENDER PAGE
           ========================================================= */

        function renderPage() {

            const gallery =
                document.getElementById(
                    'gallery'
                );


            gallery.innerHTML = '';


            const start =
                getPageStart(
                    currentPage
                );


            const pageSize =
                getPageSize(
                    currentPage
                );


            const end =
                Math.min(
                    start + pageSize,
                    allModels.length
                );


            const pageModels =
                allModels.slice(
                    start,
                    end
                );


            pageModels.forEach(
                (model, index) => {

                    const card =
                        document.createElement(
                            'div'
                        );


                    card.className =
                        'card';


                    /*
                     * ONLY the first card on page 1
                     * gets the 2x2 layout.
                     */

                    if (
                        currentPage === 0 &&
                        index === 0
                    ) {

                        card.classList.add(
                            'featured'
                        );

                    }


                    const image =
                        document.createElement(
                            'img'
                        );


                    image.src =
                        model.thumbnail ||
                        placeholderImage;


                    image.alt =
                        model.title;


                    image.draggable =
                        false;


                    const title =
                        document.createElement(
                            'div'
                        );


                    title.className =
                        'card-title';


                    title.textContent =
                        model.title;


                    card.appendChild(
                        image
                    );


                    card.appendChild(
                        title
                    );


                    card.addEventListener(
                        'click',
                        () => {

                            openModel(
                                model.uid,
                                model.title
                            );

                        }
                    );


                    gallery.appendChild(
                        card
                    );

                }
            );


            updatePagination();

        }


        /* =========================================================
           PAGINATION UI
           ========================================================= */

        function updatePagination() {

            const indicator =
                document.getElementById(
                    'page-indicator'
                );


            const previous =
                document.getElementById(
                    'previous-page'
                );


            const next =
                document.getElementById(
                    'next-page'
                );


            totalPages =
                calculateTotalPages();


            if (
                currentPage >=
                totalPages
            ) {

                currentPage =
                    totalPages - 1;

            }


            if (
                currentPage < 0
            ) {

                currentPage = 0;

            }


            indicator.textContent =
                `${currentPage + 1} / ${totalPages}`;


            previous.disabled =
                currentPage === 0;


            next.disabled =
                currentPage >=
                totalPages - 1;


            const navigation =
                document.getElementById(
                    'page-navigation'
                );


            navigation.style.display =
                totalPages > 1
                    ? 'flex'
                    : 'none';

        }


        /* =========================================================
           NEXT PAGE
           ========================================================= */

        function nextPage() {

            if (
                currentPage <
                totalPages - 1
            ) {

                currentPage++;

                renderPage();

                resetIdleTimer();

            }

        }


        /* =========================================================
           PREVIOUS PAGE
           ========================================================= */

        function previousPage() {

            if (
                currentPage > 0
            ) {

                currentPage--;

                renderPage();

                resetIdleTimer();

            }

        }


        /* =========================================================
           OPEN MODEL
           ========================================================= */

        function openModel(
            uid,
            title
        ) {

            const viewer =
                document.getElementById(
                    'viewer'
                );


            const iframe =
                document.getElementById(
                    'iframe'
                );


            const embedUrl =
                `https://sketchfab.com/models/${uid}/embed` +
                `?autostart=1` +
                `&ui_animations=0` +
                `&ui_infos=0` +
                `&ui_stop=0` +
                `&ui_inspector=0` +
                `&ui_watermark_link=0` +
                `&ui_watermark=0` +
                `&ui_ar=0` +
                `&ui_help=0` +
                `&ui_settings=0` +
                `&ui_vr=0` +
                `&ui_fullscreen=0` +
                `&ui_annotations=0`;


            iframe.src =
                embedUrl;


            viewer.style.display =
                'block';


            resetIdleTimer();

        }


        /* =========================================================
           CLOSE VIEWER
           ========================================================= */

        function closeViewer() {

            const viewer =
                document.getElementById(
                    'viewer'
                );


            const iframe =
                document.getElementById(
                    'iframe'
                );


            iframe.src = '';


            viewer.style.display =
                'none';


            clearTimeout(
                idleTimer
            );

        }


        /* =========================================================
           IDLE TIMER
           ========================================================= */

        let idleTimer = null;


        const IDLE_TIME =
            90000;


        function resetIdleTimer() {

            clearTimeout(
                idleTimer
            );


            const viewer =
                document.getElementById(
                    'viewer'
                );


            if (
                viewer.style.display !==
                'block'
            ) {

                return;

            }


            idleTimer =
                setTimeout(
                    closeViewer,
                    IDLE_TIME
                );

        }


        /* =========================================================
           POINTER ACTIVITY
           ========================================================= */

        document.addEventListener(
            'pointerdown',
            resetIdleTimer,
            { passive: true }
        );


        document.addEventListener(
            'pointermove',
            resetIdleTimer,
            { passive: true }
        );


        document.addEventListener(
            'touchstart',
            resetIdleTimer,
            { passive: true }
        );


        /* =========================================================
           CONTEXT MENU
           ========================================================= */

        document.addEventListener(
            'contextmenu',
            event => {

                event.preventDefault();

            }
        );


        /* =========================================================
           DRAGGING
           ========================================================= */

        document.addEventListener(
            'dragstart',
            event => {

                event.preventDefault();

            }
        );


        /* =========================================================
           KEYBOARD RESTRICTIONS
           ========================================================= */

        document.addEventListener(
            'keydown',
            event => {

                if (

                    event.key === 'F12' ||

                    (
                        event.ctrlKey &&
                        (
                            event.key.toLowerCase() === 'u' ||
                            event.key.toLowerCase() === 's' ||
                            event.key.toLowerCase() === 'c'
                        )
                    ) ||

                    (
                        event.metaKey &&
                        (
                            event.key.toLowerCase() === 'u' ||
                            event.key.toLowerCase() === 's' ||
                            event.key.toLowerCase() === 'c'
                        )
                    )

                ) {

                    event.preventDefault();

                    event.stopPropagation();

                }


                if (
                    event.key === 'Escape'
                ) {

                    const viewer =
                        document.getElementById(
                            'viewer'
                        );


                    if (
                        viewer.style.display ===
                        'block'
                    ) {

                        event.preventDefault();

                        resetIdleTimer();

                    }

                }

            }
        );


        /* =========================================================
           FULLSCREEN
           ========================================================= */

        function requestFullscreen() {

            const elem =
                document.documentElement;


            if (
                document.fullscreenElement
            ) {

                return;

            }


            if (
                elem.requestFullscreen
            ) {

                elem.requestFullscreen()
                    .catch(
                        error => {

                            console.warn(
                                'Fullscreen request was not accepted:',
                                error
                            );

                        }
                    );


            } else if (
                elem.webkitRequestFullscreen
            ) {

                elem.webkitRequestFullscreen();


            } else if (
                elem.msRequestFullscreen
            ) {

                elem.msRequestFullscreen();

            }

        }


        /* =========================================================
           BUTTON EVENTS
           ========================================================= */

        document
            .getElementById(
                'next-page'
            )
            .addEventListener(
                'click',
                nextPage
            );


        document
            .getElementById(
                'previous-page'
            )
            .addEventListener(
                'click',
                previousPage
            );


        document
            .getElementById(
                'back'
            )
            .addEventListener(
                'click',
                closeViewer
            );


        /* =========================================================
           INITIALIZE
           ========================================================= */

        document.addEventListener(
            'DOMContentLoaded',
            async () => {

                allModels =
                    await fetchModelsMetadata();


                currentPage = 0;


                totalPages =
                    calculateTotalPages();


                renderPage();


                requestFullscreen();

            }
        );

    </script>

</body>

</html>
