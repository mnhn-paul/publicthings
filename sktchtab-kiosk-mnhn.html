<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sketchfab Museum Kiosk</title>
    <style>
        :root {
            --bg-color: #111;
            --text-color: #fff;
            --card-bg: #222;
            --hover-scale: 1.02;
            --transition-duration: 300ms;
            --border-radius: 12px;
            --spacing: 20px;
            --font-size: 1rem;
            --placeholder-color: #444;
            --min-card-size: 200px;
            --max-card-size: 300px;
            --ui-bar-height: 50px; /* Height of the Sketchfab UI bar */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Gallery Styles */
        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--min-card-size), var(--max-card-size)));
            gap: var(--spacing);
            padding: var(--spacing);
            height: 100%;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            cursor: pointer;
            transition: transform var(--transition-duration) ease-in-out;
        }

        .card:hover, .card:active {
            transform: scale(var(--hover-scale));
        }

        .card img {
            width: 100%;
            aspect-ratio: 1.3;
            object-fit: cover;
            background: var(--placeholder-color);
        }

        .card div {
            padding: 10px;
            text-align: center;
            font-size: var(--font-size);
        }

        /* Viewer Styles */
        #viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 10;
        }

        #back {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 20;
            padding: 12px 18px;
            background: var(--card-bg);
            border: none;
            color: var(--text-color);
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: var(--border-radius);
        }

        #iframe-wrapper {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            pointer-events: auto; /* Enable interactions with the model */
        }

        /* Black bar to cover Sketchfab UI */
        #ui-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--ui-bar-height);
            background: #000;
            z-index: 15;
            pointer-events: none; /* Allow interactions to pass through to the model */
        }
    </style>
</head>
<body>
    <div id="gallery"></div>
    <div id="viewer">
        <button id="back">← Back</button>
        <div id="iframe-wrapper">
            <iframe id="iframe" allowfullscreen sandbox="allow-same-origin allow-scripts allow-forms allow-pointer-lock"></iframe>
            <div id="ui-cover"></div>
        </div>
    </div>

    <script>
        const MODEL_IDS = [
            '56816fb55d054bdc9ecd6ea6b35b44c1',
            '1dc0a7826fdd4279b8041fab6c370d07',
            'ebc60a9ceed249f186bc42bf67799708',
            '1ef831b55161418fb94e2d710839cb4f',
            'b243b5da87494a11b63441f4620dbd26',
            '453bbfa99fd5472681f1cca37ef2a028',
            '377b3b9e288d4265b5de8d95f897a5eb',
            '90318595f90541af8ffb6b5edb855c77',
            '14651059da2b4c1db1ca296920a3062a',
            '14c2c0388b4547df9c68afe943417cf6',
            '36df73258ec14448b67ba1859051c55c',
            '457e199b78d6486585075aa9647f984f',
            '44f769f570fd462db821a6ce6c96ba7a',
            'e24c52fb47db43b286ac92153e771c2c',
            '9b26c1d0988944b8aa995efce447c00b',
            '2a4a2c6702494bb6a220576773ca5f94'
        ];

        // Fetch model metadata from Sketchfab API
        async function fetchModelsMetadata() {
            const models = [];
            for (const modelId of MODEL_IDS) {
                try {
                    const response = await fetch(`https://api.sketchfab.com/v3/models/${modelId}`);
                    const data = await response.json();
                    models.push({
                        uid: modelId,
                        title: data.name || 'Untitled',
                        thumbnail: data.thumbnails?.images?.[0]?.url || null
                    });
                } catch (error) {
                    console.error(`Failed to fetch model ${modelId}:`, error);
                    models.push({
                        uid: modelId,
                        title: 'Untitled',
                        thumbnail: null
                    });
                }
            }
            return models;
        }

        // Render gallery
        async function renderGallery() {
            const models = await fetchModelsMetadata();
            const gallery = document.getElementById('gallery');
            models.forEach(model => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${model.thumbnail || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><rect width="200" height="200" fill="%23444"/></svg>'}" alt="${model.title}">
                    <div>${model.title}</div>
                `;
                card.onclick = () => openModel(model.uid, model.title);
                gallery.appendChild(card);
            });
        }

        // Open model in viewer
        function openModel(uid, title) {
            const viewer = document.getElementById('viewer');
            const iframe = document.getElementById('iframe');
            iframe.src = `https://sketchfab.com/models/${uid}/embed?autostart=1&ui_infos=0&ui_controls=0&ui_help=0&ui_hint=0&ui_settings=0&ui_vr=0&ui_ar=0&ui_watermark=0&transparent=1`;
            viewer.style.display = 'block';
            resetIdleTimer();
        }

        // Close viewer
        function closeViewer() {
            const viewer = document.getElementById('viewer');
            const iframe = document.getElementById('iframe');
            iframe.src = '';
            viewer.style.display = 'none';
        }

        // Idle timer
        let idleTimer;
        function resetIdleTimer() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(closeViewer, 90000); // 90 seconds
        }

        // Disable right-click
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        // Disable keyboard shortcuts (e.g., F12, Ctrl+U, etc.)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F12' || (e.ctrlKey && e.key === 'u') || (e.ctrlKey && e.key === 's') || (e.ctrlKey && e.key === 'c')) {
                e.preventDefault();
            }
        });

        // Request fullscreen on load
        function requestFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            renderGallery();
            requestFullscreen();
        });
        document.getElementById('back').onclick = closeViewer;
        document.onpointerdown = resetIdleTimer;
    </script>
</body>
</html>
